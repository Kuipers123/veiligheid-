<style>

  .btn.amber { background: var(--ink); border-color: var(--ink); color: var(--paper-2); } .btn.amber:hover { background: transparent; color: var(--ink); }
  .btn.green { background: transparent; border-color: var(--ok); color: var(--ok); } .btn.green:hover { background: var(--ok); color: var(--paper-2); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
  .btn.ghost:hover { color: var(--ink); background: transparent; text-decoration-thickness: 2px; }

  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .zone:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tog button { padding: 9px 0; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--ink); }
  .tog button:last-child { border-right: 0; }
  .tog button:hover { background: var(--paper-3); }
  .tog button.on-v { background: var(--ok); color: var(--paper-2); }
  .tog button.on-x { background: var(--kritiek); color: var(--paper-2); }

  .bar { height: 3px; background: var(--rule); overflow: hidden; }

  dialog::backdrop { background: rgba(25,25,25,.42); }
  dialog { padding: 0; border: 0; background: transparent; color: inherit; width: 100%; max-width: min(760px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
  dialog .card { border-color: var(--ink); background: var(--paper); }

<script>
(function () {
  "use strict";
  var KEY = "veiligheidsrondes-v4", DAY = 864e5;
  function iso(t) { var x = new Date(t); x.setHours(12, 0, 0, 0); return x.toISOString().slice(0, 10); }
  var TODAY = iso(Date.now());
  function d(n) { return iso(Date.parse(TODAY + "T12:00:00") + n * DAY); }
  function diff(a, b) { return Math.round((Date.parse(a + "T12:00:00") - Date.parse(b + "T12:00:00")) / DAY); }
  var TERMIJN = { Hoog: 2, Middel: 14, Laag: 30 };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  // ---------- Zones en checklists ----------
  var BROSHUIS_ZONES = [
    { id: "RV", n: "Ruwbouw voorbereiding", sub: "Hal 7 · snijden, zetten en plaatbewerking", risico: ["Snij- en zetmachines", "Zwaar plaatmateriaal", "Hijsen", "Scherpe randen"], extra: "Snijmachines en kantbanken: lichtschermen, afschermingen en noodstop werkend?", stroom: true },
    { id: "RB", n: "Ruwbouw", sub: "Hal 2 & 3 · lassen en opbouw chassis en liggers", risico: ["Lasrook", "Valk Welding lasrobots", "OPM (onder poederdek lassen)", "Brandgevaar", "Hijsen zware delen"], extra: "Lasrobotcellen en OPM: toegangsbeveiliging en afzuiging in orde?", stroom: true },
    { id: "CO", n: "Conservering", sub: "Hal 6 · stralen, schooperen en spuiten", risico: ["Gevaarlijke stoffen", "Spuitcabines", "Adembescherming", "Afzuiging", "Explosiegevaar (ATEX)"], extra: "Spuitcabines: ventilatie, interlock en ATEX-markering in orde?", stroom: true },
    { id: "LO", n: "Logistiek", sub: "Hal 5 · magazijn, buitenterrein en transport", risico: ["Heftruckverkeer", "Zwaar transport", "Opslag bokken en materiaal"], extra: "Heftruckroutes en voetgangerspaden gescheiden en vrij?", stroom: false },

  ];
  var ZONES = BROSHUIS_ZONES;
  function zone(id) { for (var i = 0; i < ZONES.length; i++) if (ZONES[i].id === id) return ZONES[i]; return ZONES[0] || { id: id, n: "Onbekende afdeling", sub: "", risico: [], extra: "Is de werkplek veilig?" }; }
  var TYPES = {

    "Machine- & Gereedschapskeuring": ["Zijn hijsmiddelen en kettingen gekeurd en schadevrij?", "Hebben kranen en takels een geldig keuringslabel?", "Is elektrisch handgereedschap gekeurd (NEN 3140) en onbeschadigd?", "Zijn noodstoppen bereikbaar en werkend?"],
    "Brandveiligheid & Nooduitgangen": ["Zijn nooduitgangen en blusmiddelen vrij van obstakels?", "Zijn blusmiddelen gekeurd en is het label actueel?", "Werken noodverlichting en vluchtrouteaanduiding?", "Is de opslag van gasflessen en brandbare stoffen in orde?"]
  };
  var TYPE_KEYS = Object.keys(TYPES);
  var TYPE_CODE = { "5S & Orde/Netheid": "5S", "PBM & Veilig Werken": "PBM", "Machine- & Gereedschapskeuring": "MGK", "Brandveiligheid & Nooduitgangen": "BRV" };
  function vragen(type, z) { return TYPES[type].concat([zone(z).extra]); }

  // ---------- Demodata ----------
  function mk(z, type, dag, auditor, uit) {

      mk("CO", "PBM & Veilig Werken", -24, "K. Visser", [V, { r: "x", o: "Afzuiging spuitcabine 2 geeft storingsmelding", p: "Hoog", h: "Technische dienst", f: true }, V, V, V]),
      mk("AM", "Brandveiligheid & Nooduitgangen", -16, "T. Bakker", [V, V, N, V, { r: "x", o: "Afdekplaat werkput 2 ontbreekt na einde dienst", p: "Middel", h: "Teamleider afmontage" }]),
      mk("TD", "Machine- & Gereedschapskeuring", -12, "M. Hendriks", [V, V, V, V, V]),
